name: Render AUTONOM brand assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'social-preview.svg'
      - 'favicon.svg'
      - 'scripts/render_brand_assets.py'
permissions:
  contents: write
concurrency:
  group: autonom-brand-assets
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image rendering dependencies
        run: python -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'Pillow>=10,<13'
      - name: Render social card and icons
        run: python scripts/render_brand_assets.py
      - name: Commit rendered brand assets
        run: |
          git config user.name "autonom-brand-bot"
          git config user.email "autonom-brand-bot@users.noreply.github.com"
          git add social-preview.png favicon-32.png apple-touch-icon.png favicon.ico
          if git diff --cached --quiet; then
            echo "Brand assets already current."
          else
            git commit -m "Render ivory-and-Oxford social preview and favicon images"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
