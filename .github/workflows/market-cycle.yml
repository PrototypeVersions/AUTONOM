name: AUTONOM market cycle
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  schedule:
    # 11:15 UTC weekdays: premarket decision intake (DST-safe conservative fills).
    - cron: '15 11 * * 1-5'
    # 13:00 UTC weekdays catches early model decisions before the summer stock open.
    - cron: '0 13 * * 1-5'
    # 14:00 UTC weekdays catches early model decisions before the winter stock open.
    - cron: '0 14 * * 1-5'
    # 22:30 UTC weekdays: after US equity close (DST-safe).
    - cron: '30 22 * * 1-5'
    # 23:30 UTC daily: pick up afternoon crypto decisions before the next UTC day.
    - cron: '30 23 * * *'
    # 02:20 UTC daily: just-completed UTC crypto candle.
    - cron: '20 2 * * *'
permissions:
  contents: write
concurrency:
  group: autonom-market-cycle
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate engine
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: node --check app.js
      - name: Collect prices and process eligible paper orders
        run: python scripts/market_cycle.py
      - name: Commit prospective record and market state
        run: |
          git config user.name "autonom-market-bot"
          git config user.email "autonom-market-bot@users.noreply.github.com"
          git add data/state.json data/market.json data/history.json data/events.json data/research.json data/status.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Market cycle: collect reference bars and process prospective decisions"
            git push
          fi
